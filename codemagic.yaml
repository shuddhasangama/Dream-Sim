workflows:
  android-play:
    name: DhaShu Android Play Bundle
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      android_signing:
        - dhashu-upload
      vars:
        DHASHU_SIMULATED_CLOCK: "false"
    scripts:
      - name: Install npm dependencies
        script: cd "$CM_BUILD_DIR/mobile" && npm ci
      - name: Run mobile tests
        script: cd "$CM_BUILD_DIR/mobile" && npm test
      - name: Build and sync Android
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          npm run build
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Build signed Play bundle
        script: |
          set -e
          : "${CM_KEYSTORE_PATH:?Missing signing keystore}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          : "${PROJECT_BUILD_NUMBER:?Missing build number}"
          cd "$CM_BUILD_DIR/mobile/android"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew bundleRelease -PbuildNumber="$PROJECT_BUILD_NUMBER" --stacktrace
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
    # Download and upload the first bundle manually to Play internal testing.
  android-beta:
    name: DhaShu Android APK Beta
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      vars:
        DHASHU_SIMULATED_CLOCK: "false"
    scripts:
      - name: Install npm dependencies
        script: cd "$CM_BUILD_DIR/mobile" && npm ci
      - name: Run mobile tests
        script: cd "$CM_BUILD_DIR/mobile" && npm test
      - name: Build and sync Android
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          npm run build
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Build installable beta APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile/android"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildNumber="$PROJECT_BUILD_NUMBER" --stacktrace
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    # Debug-signed APK for direct installation. Play signing comes separately.
  ios-testflight:
    name: DhaShu iOS TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dhashu.app
      vars:
        BUNDLE_ID: "com.dhashu.app"
        # road-fixes-clock-spec.md §7.8: a convenience switch for this
        # build only — it does NOT replace the server-side gate. The
        # server's own journey/status simulated_clock flag still has to
        # be true too before the app will show any clock-stepping
        # controls at all (mobile/src/main.js and week.js).
        DHASHU_SIMULATED_CLOCK: "false"
    scripts:
      - name: Show working directory
        script: pwd && ls -la

      - name: Install npm dependencies
        script: cd $CM_BUILD_DIR/mobile && npm ci

      - name: Run mobile tests
        script: cd $CM_BUILD_DIR/mobile && npm test

      - name: Build web bundle
        script: cd $CM_BUILD_DIR/mobile && npm run build

      - name: Add iOS platform
        script: |
          cd $CM_BUILD_DIR/mobile
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Generate iOS assets
        script: cd $CM_BUILD_DIR/mobile && npx capacitor-assets generate --ios

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR/mobile/ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Diagnose Xcode project
        script: |
          cd $CM_BUILD_DIR/mobile
          echo "=== plugin present? ==="
          ls -la node_modules/session-vault || echo "MISSING"
          echo "=== capacitor sees plugins? ==="
          npx cap ls ios || true
          echo "=== raw xcodebuild error ==="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | tail -40
          echo "=== SPM resolution ==="
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj 2>&1 | tail -40

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR/mobile
          xcode-project use-profiles
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
