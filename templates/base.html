<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dare to Dream — Sim{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    {% include "_demo_bar.html" %}
    {% if session_user %}
    <nav class="topnav">
      {# Driven by disclosure.SURFACES, not by conditions scattered through
         this file. To change what appears when, edit that one table. #}
      {% for link in nav_links %}
      <a class="navlink" href="{{ url_for(link.endpoint) }}">{{ link.label }}</a>
      {% endfor %}
      <form method="post" action="{{ url_for('logout') }}" style="margin:0;display:inline;">
        <button type="submit" class="navlink" style="background:none;border:none;font:inherit;cursor:pointer;">Switch user</button>
      </form>
    </nav>
    {% endif %}
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
