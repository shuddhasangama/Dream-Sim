# Continuous integration: tests and security scans on every push and pull request.
# Never deploys, never builds release/store artifacts, never uses production
# credentials. Branch protection (required checks) is a manual GitHub setting.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (SQLite + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: dhashu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dhashu_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONIOENCODING: utf-8
      # The app database is never set: tests use SQLite temp files, and only the
      # Postgres-backed tests receive the isolated CI database below.
      TEST_PG_DSN: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/dhashu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          unset DATABASE_URL
          printf '%s' "$TEST_PG_DSN" > "$RUNNER_TEMP/pg-dsn"
          export AUTH_TEST_POSTGRES_DSN_FILE="$RUNNER_TEMP/pg-dsn"
          export ADMIN_TEST_POSTGRES_URL="$TEST_PG_DSN"
          export TEST_AVATAR_POSTGRES_URL="$TEST_PG_DSN"
          python -m pytest -q -p no:cacheprovider -rfEs

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  security-scans:
    name: Security scans (pip-audit, npm audit, bandit, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install scanners
        run: python -m pip install -r requirements-dev.txt
      - name: pip-audit (runtime requirements)
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: bandit (fail on high severity)
        run: python -m bandit -q -r . -x ./.venv,./mobile,./data,./dev-reports,"./Claude outputs" --severity-level high
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (production dependencies)
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        working-directory: mobile
        run: npm audit --audit-level=critical || echo "::warning::dev-dependency advisories present (see npm audit output); tracked in the security report"
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # Download the exact release asset under its own name: the checksums file
          # refers to it by that name, and sha256sum -c opens the file by that name.
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          work="$RUNNER_TEMP/gitleaks"
          mkdir -p "$work"
          cd "$work"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$sums" "$base/$sums"
          grep " ${asset}\$" "$sums" > "${asset}.sha256" || { echo "::error::no checksum line for $asset"; exit 1; }
          sha256sum -c "${asset}.sha256"
          tar -xzf "$asset" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$work/gitleaks" git . --log-opts="--all" --redact --no-banner --gitleaks-ignore-path .gitleaksignore
